name: Update apps

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Bump apps with new upstream releases
        id: bump
        run: echo "changed=$(python .github/scripts/update_apps.py)" >> "$GITHUB_OUTPUT"
      - run: python .github/scripts/check_store.py
      - name: Commit
        if: steps.bump.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update ${{ steps.bump.outputs.changed }}"
          git push
