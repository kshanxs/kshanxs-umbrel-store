name: 9Router
version: "0.5.116"
tagline: Free AI router with automatic fallback across providers
icon: https://cdn.jsdelivr.net/gh/kshanxs/kshanxs-umbrel-store@main/kshan-9router/icon.svg
description: >-
  9Router is an OpenAI-compatible AI gateway. Connect your AI accounts and free
  providers once, then point every app at one endpoint. When a provider hits a
  limit, 9Router moves on to the next one automatically.


  Highlights:


  - One OpenAI-compatible endpoint for 40+ providers, including OpenRouter, Gemini,
  Groq, NVIDIA NIM, Kiro and OpenCode Free

  - Combos: ordered model lists with automatic fallback

  - Usage and quota tracking per provider

  - API keys for each app that uses it


  Other apps on your Umbrel can reach it at http://kshan-9router_web_1:20128/v1
  using an API key from the dashboard.
