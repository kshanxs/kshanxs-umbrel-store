version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kshan-9router_web_1
      APP_PORT: 20128
      PROXY_AUTH_WHITELIST: "/v1/*"

  web:
    image: decolua/9router:0.5.116@sha256:12086f97857f784ab7762e95595f70d71279a7a60c800af0f100183e8da7ea36
    restart: on-failure
    stop_grace_period: 30s
    env_file:
      - path: ${APP_DATA_DIR}/data/app.env
        required: false
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: $APP_PASSWORD
      NODE_ENV: production
      REQUIRE_API_KEY: "true"
      BASE_URL: http://127.0.0.1:20128
    volumes:
      - ${APP_DATA_DIR}/data/9router:/app/data
