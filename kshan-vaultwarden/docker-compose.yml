version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kshan-vaultwarden_server_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  server:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: UTC
      # Admin page token (/admin). Shown in Umbrel before you open the app.
      ADMIN_TOKEN: $APP_PASSWORD
      SIGNUPS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/data
