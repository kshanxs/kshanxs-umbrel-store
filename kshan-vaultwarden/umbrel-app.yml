manifestVersion: 1
id: kshan-vaultwarden
category: files
name: Vaultwarden
version: "1.37.5"
tagline: Self-hosted password manager, compatible with Bitwarden apps
icon: https://cdn.jsdelivr.net/gh/kshanxs/kshanxs-umbrel-store@main/kshan-vaultwarden/icon.svg
description: >-
  Vaultwarden is a lightweight, self-hosted server for your password vault. It is
  an unofficial, Bitwarden-compatible server, so the official Bitwarden apps,
  browser extensions and CLI can sync with it. Your encrypted vault stays on your
  Umbrel.


  Connecting your devices: Bitwarden clients need an HTTPS address. Use Tailscale
  Serve, Umbrel's local HTTPS, or another HTTPS reverse proxy, then enter that
  address as the self-hosted server URL in your Bitwarden client.


  Open the app's /admin page with the admin token Umbrel shows you to manage users
  and settings. Account signup is enabled by default. Turn it off in the admin
  page once your accounts are created.


  Vaultwarden is not associated with Bitwarden or 8bit Solutions LLC.
developer: Daniel García
website: https://github.com/dani-garcia
dependencies: []
repo: https://github.com/dani-garcia/vaultwarden
support: https://github.com/dani-garcia/vaultwarden/issues
port: 8222
gallery: []
path: ""
defaultUsername: ""
deterministicPassword: true
requiresHttps: true
releaseNotes: >-
  First release of Vaultwarden on kshanx's App. Updated to 1.37.5.
