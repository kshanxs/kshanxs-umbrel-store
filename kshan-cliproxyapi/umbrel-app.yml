manifestVersion: 1
id: kshan-cliproxyapi
category: ai
name: CLIProxyAPI
version: "8.0.56"
tagline: Use your AI subscriptions from every device through one home hub
icon: https://cdn.jsdelivr.net/gh/kshanxs/kshanxs-umbrel-store@main/kshan-cliproxyapi/icon.svg
description: >-
  CLIProxyAPI signs your AI subscriptions (Antigravity, Gemini CLI, Claude Code,
  Codex and more) into your Umbrel once, keeps the logins fresh, and gives you one
  API endpoint. Your laptops and other machines point their coding tools at it over
  Tailscale, so all traffic comes from one home IP instead of many devices.


  Open the app to use the management panel: log in with the key Umbrel shows you,
  add accounts under OAuth Login, and copy an API key for your devices.


  Using subscriptions through a proxy may be against a provider's terms and can
  get an account restricted. Use it only for your own coding tools.
developer: router-for-me
website: https://help.router-for.me
dependencies: []
repo: https://github.com/router-for-me/CLIProxyAPI
support: https://github.com/router-for-me/CLIProxyAPI/issues
port: 8317
gallery: []
path: "/management.html"
defaultUsername: ""
deterministicPassword: true
releaseNotes: >-
  Updated to 8.0.56. See what changed: https://github.com/router-for-me/CLIProxyAPI/releases
