version: "3.7"

services:
  app_proxy:
    environment:
      # The pairing helper (pair.py) runs on the Umbrel host, on the Docker bridge
      # address that the app proxy can reach. It is not reachable from the LAN.
      APP_HOST: 10.21.0.1
      APP_PORT: 3772

  server:
    image: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    # T3 Code must run on the Umbrel itself, as user umbrel, so its agents
    # (Claude Code) can use the same files, tools and logins as a terminal.
    # The container only steps into the host with nsenter and starts run.sh.
    privileged: true
    pid: host
    network_mode: host
    init: true
    restart: on-failure
    stop_grace_period: 30s
    command:
      - nsenter
      - --target=1
      - --all
      - --
      - setpriv
      - --reuid=1000
      - --regid=1000
      - --init-groups
      - env
      - -i
      - HOME=/home/umbrel
      - USER=umbrel
      - LOGNAME=umbrel
      - SHELL=/bin/bash
      - LANG=C.UTF-8
      - TERM=xterm-256color
      - /bin/bash
      - ${APP_DATA_DIR}/run.sh
      - ${APP_DATA_DIR}
