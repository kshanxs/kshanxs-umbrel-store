path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Free storage, Working now: each item stays listed from download to Google's check ("Checking with Google") and leaves once it is freed, so one file can be followed step by step, as in 1.5.6. New items still start without waiting for the check, so freeing is as fast as before. Numbers that agree: Overview's strip and Running now count the same work; Library says how many files are still to back up, matching the count in the menu; Sync's ring is the share of files, with the share of space beside it; Copy accounts says what the other account had at the last read and how many GP Sync copied…
submitter: kshanxs
submission: https://github.com/kshanxs/kshanxs-umbrel-store
