path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  New Copy accounts page: copies everything one connected Google account owns to another, newest first, one file at a time. Items the other account already has are skipped. Each file is downloaded, checked to be Google's original, uploaded the free way, and its favourite, archive and caption come along; then the copy on the server is removed. Filter by photos, videos and years; pause, resume, stop and retry failed ones. Nothing is deleted in either account. Every 25 copies GP Sync checks with Google that they don't count against the other account's storage, and pauses if they do. Albums…
