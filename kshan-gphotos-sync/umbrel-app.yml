releaseNotes: >-
  Yours in Google Photos:** a card on Free storage shows how much of your data Google holds (each file once, at full size), how much of it is stored free, and photos and videos apart. Using storage matches Google One:** every copy of a file counts (Google charges each one), and so does Google's Trash until it is emptied. Freeing a file frees all its copies. Freed originals no longer stay in Google's Trash:** a delete Google missed left some there, still counted. GP Sync deletes once more right after, and empties the ones left behind. No more "Google hasn't deleted it yet" loop:** GP Sync's own…
