releaseNotes: >-
  Fix dates is automatic: GP Sync checks the file is unchanged, deletes Google's copy (Trash, then permanently) and uploads it again with the right date. No albums or manual steps. Free storage is automatic: items that count against your storage are downloaded, deleted in Google and uploaded again free, keeping the date Google showed (Snapchat saves included). Accounts work at the same time: Free storage, Fix dates and copies run in parallel per account and per copy pair. Overview lists everything running under "Also running". Every re-upload sends its original date to Google, and each job…
