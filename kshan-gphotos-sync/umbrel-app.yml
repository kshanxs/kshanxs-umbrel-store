releaseNotes: >-
  Auto free storage:** a switch at the top of Free storage (also in Moving settings). On, what your phones' Google Photos app backs up (iPhone, Android, new Snapchat saves too) is freed as it arrives: every 15 minutes each account's library is brought up to date and new items that count against storage are queued, after waiting 10 minutes so the phone has finished. Items handled before are never queued again, and nothing is taken on while an account is paused or held. Free storage fixes, from the logs:**. A photo the phone backed up (counted, and only found "already in Google" by GP Sync) made…
