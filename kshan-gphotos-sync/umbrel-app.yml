releaseNotes: >-
  Settings, regrouped: Backup (Sync, Folders, Google accounts), Google Photos (Albums, Dates, Sources, Duplicates, Google tools) and App. Every option lives there, including the per-app album, caption and archive choices and pausing account copies. Dates explains why some photos have no date and what the "Date unknown" album is for. Google accounts: each account with its folders and state, buttons for its storage and dates, Manage to check logins, read libraries or check dates for several accounts at once, and a prompt to give Claude Code or Codex to fetch the login line from your phone. Fix…
