defaultPassword: ""
releaseNotes: >-
  Snapchat: shorter group cards. "Already in Google" and "In Google, wrong date" now say what happens in one line each; the details (originals keep their date, which copies are downloaded first, albums you made yourself) are under How it works and in each button's confirmation.
