port: 8527
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixed: Free storage said "Didn't work: the download is not exactly Google's original" for some videos. Google serves a copy it changed slightly (same size, an edited date inside) and lists that copy's checksum next to the original's. A download is now accepted when it matches a checksum Google gives for that item, and is uploaded again with its own checksum. Items that failed this way are tried again once. Fixed: items freed or copied between accounts got "{}" as their caption in Google Photos (the library list shows "no caption" that way). It is never copied again, and the "{}" is cleared…
submitter: kshanxs
submission: https://github.com/kshanxs/kshanxs-umbrel-store
