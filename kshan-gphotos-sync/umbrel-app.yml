releaseNotes: >-
  Fixed: the repeated "Could not update album … 404" error. One item missing from Google (deleted, or moved to the Trash or Locked folder) made Google refuse a whole batch, so albums like Snapchat were never made. Items are now checked against the library first (a replaced item is found under its new key), and a refused batch is split so everything else still goes in. Downloads: when freeing storage, choose "Delete the downloaded copy after the upload". Turned off, the copies are kept on the server, per account, to save or delete on the new Downloads page. Diagnostics: one JSON file with…
