version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kshan-gphotos-sync_web_1
      APP_PORT: 8527

  web:
    # All code ships inside this image. The release workflow updates this line
    # (Umbrel updates only copy this file, umbrel-app.yml and hooks).
    # app-source: 3710b0051ce706d4
    image: kshanxs/gp-sync:1.5.11@sha256:e87820cf153ba00919661b9b67bb7685b83ea4a1233c3f71c646fec894548941
    restart: on-failure
    stop_grace_period: 20s
    environment:
      TZ: UTC
      # Tells the app it runs on Umbrel (Umbrel's name, hints and folders). Without it the app
      # assumes a plain Docker host.
      PLATFORM: umbrel
      HOST_NAME: Umbrel
      SCAN_INTERVAL_MINUTES: "5"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # The whole Umbrel home, read-only: choose folders in Settings (Photos and Videos by default).
      # The app never changes or deletes anything on Umbrel.
      - ${UMBREL_ROOT}/home:/media:ro
      # The only writable folder: photos and videos uploaded from phones in the dashboard.
      - ${UMBREL_ROOT}/home/Photos/Uploads:/uploads

