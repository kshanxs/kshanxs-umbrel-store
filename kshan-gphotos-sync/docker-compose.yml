version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kshan-gphotos-sync_web_1
      APP_PORT: 8527

  web:
    # All code ships inside this image. The release workflow updates this line
    # (Umbrel updates only copy this file, umbrel-app.yml and hooks).
    # app-source: 3710b0051ce706d4
    image: kshanxs/gp-sync:1.9.4@sha256:7da421eea2f149880b7f84b817f4dd1b6bd1dc67edff4728f71e9feb73fb1fa0
    restart: on-failure
    stop_grace_period: 20s
    environment:
      TZ: UTC
      # Tells the app it runs on Umbrel (Umbrel's name, hints and folders). Without it the app
      # assumes a plain Docker host.
      PLATFORM: umbrel
      HOST_NAME: Umbrel
      SCAN_INTERVAL_MINUTES: "5"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # The whole Umbrel home: choose folders in Settings (Photos and Videos by default). Writable
      # only so the Deleted in Google page can delete a file you deleted in Google Photos, when you
      # press Delete and confirm; GP Sync never changes or deletes anything on Umbrel otherwise.
      - ${UMBREL_ROOT}/home:/media
      # The only writable folder: photos and videos uploaded from phones in the dashboard.
      - ${UMBREL_ROOT}/home/Photos/Uploads:/uploads

