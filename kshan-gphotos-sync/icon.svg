<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".22" cy=".18" r=".55">
      <stop offset="0" stop-color="#99f6e4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".95" r=".6">
      <stop offset="0" stop-color="#f0abfc" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <clipPath id="cloudclip"><path d="M88 184 H176 A38 38 0 0 0 179.65 108.18 A48 48 0 0 0 84.05 116.23 A34 34 0 0 0 88.00 184.00 Z"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glowA)"/>
  <rect width="256" height="256" rx="58" fill="url(#glowB)"/>

  <g transform="translate(-25 -26) scale(1.14)">
  <!-- frosted glass cloud -->
  <g filter="url(#shadow)">
    <path d="M88 184 H176 A38 38 0 0 0 179.65 108.18 A48 48 0 0 0 84.05 116.23 A34 34 0 0 0 88.00 184.00 Z" fill="url(#glass)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <ellipse cx="118" cy="84" rx="44" ry="20" fill="url(#sheen)" clip-path="url(#cloudclip)"/>

  <!-- photo -->
  <g transform="rotate(-6 128 136)">
    <rect x="96" y="110" width="64" height="50" rx="9" fill="#ffffff"/>
    <rect x="101" y="115" width="54" height="40" rx="5" fill="#e0f2fe"/>
    <circle cx="115" cy="127" r="5.5" fill="#fbbf24"/>
    <path d="M101 155 L120 134 L131 145 L140 137 L155 151 L155 150 Q155 155 150 155 Z" fill="url(#hill)"/>
  </g>

  <!-- sync badge -->
  <g filter="url(#shadow)">
    <circle cx="186" cy="180" r="27" fill="#ffffff"/>
  </g>
  <circle cx="186" cy="180" r="22" fill="url(#badge)"/>
  <g transform="translate(172 166) scale(1.17)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
  </g>
  </g>
</svg>
